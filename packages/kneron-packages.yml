description: >-
  First-party Kneron developer libraries and toolchain distributions. Kneron is an
  edge-AI silicon company: its client libraries are on-device inference SDKs (C /
  C++ / Python) and model-compilation toolchains, not HTTP API client libraries.
  None of them are published to npm, PyPI, Maven Central, NuGet, RubyGems,
  Packagist or crates.io — the registry probes below all returned 404. The real
  first-party distribution channels are (a) versioned archives behind the Kneron
  Developer Center download listing (registration required for some assets),
  (b) the github.com/kneron organization, and (c) Docker Hub for the model
  toolchain. Versions recorded are those listed on the Developer Center on the
  fetch date.
