aid: kneron
name: Kneron
description: 'Kneron is a full-stack edge AI company founded in October 2015 by Albert Liu and
  headquartered in San Diego, California, with operations in Taipei. It designs its own
  reconfigurable neural processing unit (NPU) architecture and ships it as edge AI system-on-chip
  silicon — the KL520, KL720, KL630, KL730, KL830 and KL1140 lines — together with the software
  needed to run models on that silicon: the Kneron PLUS (KP) inference SDK for C, C++ and Python,
  per-device firmware SDKs, and a model toolchain of ONNX converter, compiler, quantizer,
  evaluator and simulator distributed as the kneron/toolchain container. Products built on the
  stack include the KNEO Pi single-board computer and its developer community, the KNEO
  marketplace of edge AI applications, the KNEO 300/330 private edge GPT servers and the KneoEdge
  line of on-premise LLM and VLM appliances aimed at healthcare, finance and government buyers who
  need air-gapped inference. Kneron has raised roughly $190M from Horizons Ventures, Alibaba
  Entrepreneurs Fund, Qualcomm, Sequoia Capital, CDIB, Foxconn and Himax. Kneron publishes no
  public HTTP API: contract discovery across www.kneron.com, doc.kneron.com, kneo.kneron.com and
  kneoedge.kneron.com found no OpenAPI, Swagger, GraphQL, AsyncAPI, MCP or A2A surface, and no
  /.well-known/ documents. Its programmable surface is the on-device KP API plus toolchain CLIs,
  and its one machine-readable agent-facing artifact is a published llms.txt at
  kneoedge.kneron.com describing the on-premise LLM appliance line.'
