description: >-
  Kneron versions software artifacts (SDK archives, firmware, OS images), not a
  network API — there is no public HTTP API to version, no API version header,
  and no dated API changelog. What follows is the release surface Kneron
  actually publishes on its Developer Center and documentation site.
